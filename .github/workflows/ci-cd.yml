# Pipeline de CI/CD do UsersAPI (GitHub Actions).
#
#   push na main ──► Build & Test ──► Imagem (build + scan + push no ACR) ──► Deploy no AKS
#   Pull Request ──► só Build & Test (valida antes do merge)
#   push na tech_fase_4 ──► mesmo fluxo (deploy de teste antes do merge na main)
#   Run workflow (manual) ──► mesmo fluxo; só aparece depois que o workflow estiver na main
#
# Assim o que está na main é exatamente o que está rodando em produção.

name: CI/CD UsersAPI

on:
  push:
    branches:
      - main
      - tech_fase_4 # shortcut: permite testar o deploy antes do merge; remover após o merge na main.
    paths-ignore:
      - README.md
  pull_request:
    branches:
      - main
  # Permite rodar pela aba Actions (Run workflow). O GitHub só mostra o botão
  # depois que este arquivo existir na main.
  workflow_dispatch:

# Na mesma branch, uma execução nova espera a anterior terminar. Entre branches diferentes
# (main e tech_fase_4), quem impede dois deploys juntos é o concurrency do job de deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Permissão mínima do token do GitHub. Os jobs que precisam de OIDC pedem id-token: write.
permissions:
  contents: read

env:
  # Mesmo nome usado no k8s/deployment.yaml (image: fcg-users-api:latest).
  IMAGE_REPOSITORY: fcg-users-api

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: dotnet build
        run: dotnet build FCG.Usuario.slnx -c Release

      - name: dotnet test
        run: >
          dotnet test FCG.Usuario.slnx -c Release --no-build
          --logger trx --results-directory TestResults
          --collect "XPlat Code Coverage"

      # Resultados (.trx) e cobertura (coverage.cobertura.xml) ficam para download na execução,
      # mesmo quando algum teste falha.
      - name: Publicar resultados dos testes e cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults

  image:
    name: Imagem Docker (build, scan e push no ACR)
    needs: build-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # O login no Azure é por OIDC (sem senha guardada no GitHub). A credencial federada do Azure
    # confia só em jobs deste repositório que rodam no environment "production"
    # (subject repo:fiappostech2026/techchallenge_fase2_user:environment:production).
    environment: production
    permissions:
      id-token: write
      contents: read
    outputs:
      image: ${{ steps.image-name.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Login no Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Cada execução gera uma tag única e rastreável (o número da execução).
      - name: Definir nome da imagem
        id: image-name
        run: echo "image=${{ vars.ACR_NAME }}.azurecr.io/${IMAGE_REPOSITORY}:${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: docker build (${{ github.run_number }})
        run: docker build -t ${{ steps.image-name.outputs.image }} .

      # Security scan (desejável no Tech Challenge): o Trivy lista CVEs HIGH/CRITICAL
      # da imagem. --exit-code 0 só reporta; troque para 1 para bloquear a pipeline.
      - name: Trivy - scan de vulnerabilidades
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.58.1 image --no-progress --ignore-unfixed
          --severity HIGH,CRITICAL --exit-code 0 ${{ steps.image-name.outputs.image }}

      - name: docker push no ACR
        run: |
          az acr login --name ${{ vars.ACR_NAME }}
          docker push ${{ steps.image-name.outputs.image }}

  deploy:
    name: Deploy no AKS (rolling update do users-api)
    needs: image
    # Uma fila só para o deploy, em qualquer branch: main e tech_fase_4 não mexem no AKS juntas.
    concurrency:
      group: deploy-users
      cancel-in-progress: false
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Mesmo environment do job image (exigido pela credencial OIDC). Em Settings > Environments >
    # production o GitHub guarda o histórico de deploys e permite exigir aprovação manual.
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Login no Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Conectar no AKS
        run: az aks get-credentials -g ${{ vars.AKS_RESOURCE_GROUP }} -n ${{ vars.AKS_CLUSTER_NAME }} --overwrite-existing

      - name: Aplicar Secret, manifestos e nova imagem
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          SQL_PASSWORD: ${{ secrets.USERS_SQL_PASSWORD }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          RABBITMQ_HOST: ${{ secrets.RABBITMQ_HOST }}
          RABBITMQ_VHOST: ${{ secrets.RABBITMQ_VHOST }}
          RABBITMQ_PORT: ${{ secrets.RABBITMQ_PORT }}
          RABBITMQ_USE_SSL: ${{ secrets.RABBITMQ_USE_SSL }}
          RABBITMQ_USER: ${{ secrets.RABBITMQ_USER }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
        run: |
          set -euo pipefail

          # Secret criado a cada deploy a partir dos Secrets do GitHub — nunca vem do Git.
          kubectl create secret generic users-secret \
            --from-literal=MSSQL_SA_PASSWORD="$SQL_PASSWORD" \
            --from-literal=ConnectionStrings__DefaultConnection="Server=users-sqlserver,1433;Database=users;User Id=sa;Password=$SQL_PASSWORD;TrustServerCertificate=True" \
            --from-literal=Jwt__SecretKey="$JWT_SECRET_KEY" \
            --from-literal=RABBITMQ__HOST="$RABBITMQ_HOST" \
            --from-literal=RABBITMQ__VIRTUALHOST="$RABBITMQ_VHOST" \
            --from-literal=RABBITMQ__PORT="$RABBITMQ_PORT" \
            --from-literal=RABBITMQ__USESSL="$RABBITMQ_USE_SSL" \
            --from-literal=RABBITMQ__USERNAME="$RABBITMQ_USER" \
            --from-literal=RABBITMQ__PASSWORD="$RABBITMQ_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

          # Dependências do serviço (bancos, cache) e configuração.
          kubectl apply \
            -f k8s/configmap.yaml \
            -f k8s/sqlserver-deployment.yaml -f k8s/sqlserver-service.yaml \
            -f k8s/service.yaml

          # A API com a imagem recém-publicada: dispara o Rolling Update.
          sed "s|image: ${IMAGE_REPOSITORY}:latest|image: ${IMAGE}|" k8s/deployment.yaml | kubectl apply -f -

      # Step próprio para o rollback saber se a falha foi no rollout.
      # Se falhar antes (login, Secret, apply), não há versão nova para desfazer.
      - name: Aguardar o rollout
        id: rollout
        # Só termina com sucesso quando todos os Pods novos estiverem prontos.
        run: kubectl rollout status deployment/users-api --timeout=300s

      # Se o rollout falhar (Pod novo não fica pronto), volta para a versão anterior.
      # Os Pods antigos nunca saíram do ar por causa do maxUnavailable: 0.
      - name: Rollback automático
        if: failure() && steps.rollout.outcome == 'failure'
        run: kubectl rollout undo deployment/users-api
